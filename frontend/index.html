<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>EPI Inteligente</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h1>EPI Inteligente</h1>
    <p>Monitoramento do equipamento em tempo real</p>
</header>

<main>

    <section class="cards">

        <div class="card">
            <h2>Bateria</h2>
            <div id="battery">--%</div>
        </div>

        <div class="card">
            <h2>Capacete</h2>
            <div id="helmet">---</div>
        </div>

    </section>

    <section class="gyro card">

        <h2>Giroscópio</h2>

        <div class="gyro-values">

            <div>
                <span>X</span>
                <strong id="gyro-x">--</strong>
            </div>

            <div>
                <span>Y</span>
                <strong id="gyro-y">--</strong>
            </div>

            <div>
                <span>Z</span>
                <strong id="gyro-z">--</strong>
            </div>

        </div>

    </section>

    <div id="connection">
        ● Conectando ao simulador...
    </div>

</main>

<script src="script.js"></script>

</body>
</html>
