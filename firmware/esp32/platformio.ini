[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    adafruit/Adafruit SSD1306
    adafruit/Adafruit GFX Library
    finani/ICM20689
    bblanchon/ArduinoJson
board_build.filesystem = littlefs

[env:esp32test]
extends = env:esp32dev
test_build_src = yes
build_src_filter = +<*> -<main.cpp>
